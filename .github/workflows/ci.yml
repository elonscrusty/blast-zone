name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -e
          mkdir -p "$HOME/bin"
          get() {
            for i in 1 2 3 4; do
              curl -fsSL -o /tmp/t.zip "$1" && break
              sleep $((i * 3))
            done
            unzip -oq /tmp/t.zip -d "$HOME/bin"
          }
          get https://github.com/lune-org/lune/releases/download/v0.10.0/lune-0.10.0-linux-x86_64.zip
          get https://github.com/JohnnyMorganz/StyLua/releases/download/v2.0.2/stylua-linux-x86_64.zip
          get https://github.com/rojo-rbx/rojo/releases/download/v7.5.1/rojo-7.5.1-linux-x86_64.zip
          get https://github.com/Kampfkarren/selene/releases/download/0.28.0/selene-0.28.0-linux.zip
          chmod +x "$HOME/bin/"*
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Format check
        run: stylua --check src tests
      - name: Lint
        run: selene src
      - name: Unit tests
        run: lune run tests/run
      - name: Build place
        run: rojo build default.project.json -o BlastZone.rbxl
