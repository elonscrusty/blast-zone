<title>Circuit District Guns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one showroom stage up top, gun picker and spec plate under it. Single dark look on purpose. */
:root {
  --bg: #0b1220;
  --stage: #14243a;
  --panel: #111c2e;
  --line: #24364f;
  --fg: #e8eef6;
  --muted: #8ea2bb;
  --cyan: #36d9e8;
  --gold: #ffc44d;
  --coral: #f15b64;
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); }
.wrap {
  max-width: 880px; margin: 0 auto;
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-size: 1.5rem; letter-spacing: .04em; margin: 0; text-transform: uppercase; }
.hint { color: var(--muted); font-size: .85rem; }
.stage {
  position: relative; border-radius: 14px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 30%, #1d3352 0%, var(--stage) 55%, #0c1626 100%);
  border: 1px solid var(--line);
  aspect-ratio: 4 / 3; max-height: 62vh; width: 100%; max-width: 100%;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.tag {
  position: absolute; left: 14px; top: 12px;
  font-family: var(--display); font-size: 2rem; line-height: 1; letter-spacing: .03em; text-transform: uppercase;
  text-shadow: 0 2px 12px rgba(0,0,0,.5); pointer-events: none;
}
.tag small { display: block; font-family: var(--mono); font-size: .75rem; color: var(--cyan); letter-spacing: .12em; margin-top: 4px; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.zoom button {
  width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(11,18,32,.75); color: var(--fg); font-size: 1.3rem; font-family: var(--mono);
}
.picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pick {
  min-height: 64px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font-family: var(--display); font-size: 1rem; text-transform: uppercase; letter-spacing: .04em;
  display: grid; gap: 2px; place-content: center; text-align: center; padding: 6px 4px;
}
.pick span { font-family: var(--mono); font-size: .68rem; color: var(--muted); letter-spacing: .1em; text-transform: none; }
.pick[aria-pressed="true"] { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); }
.pick:focus-visible, .zoom button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.plate { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 12px; }
.role { font-size: 1.05rem; margin: 0; }
.role b { color: var(--gold); font-weight: 600; }
.stats { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 4.5em; gap: 10px; align-items: center; font-size: .85rem; }
.row .k { color: var(--muted); }
.row .v { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: #1b2a40; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--cyan); border-radius: 4px; transition: width .35s ease; }
.bar u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--gold); text-decoration: none; }
.legend { font-size: .75rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.legend em { font-style: normal; display: inline-flex; align-items: center; gap: 6px; }
.legend em::before { content: ""; width: 12px; height: 6px; border-radius: 3px; background: var(--cyan); }
.legend em.p::before { width: 2px; height: 12px; background: var(--gold); }
@media (max-width: 520px) {
  .tag { font-size: 1.45rem; }
  .picks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

  </div>
  <div class="picks" id="picks"></div>
  <section class="plate">

    <div class="stats" id="stats"></div>
    <div class="legend"><em>this gun</em><em class="p">Volt Pistol (you have it)</em></div>
  </section>
</div>

const mats = {};
function mat(name) {
  if (mats[name]) return mats[name];
  const L = LOOK[name] || LOOK.poly;
  let m;
  const col = new THREE.Color(L.c).convertSRGBToLinear();
  if (L.neon) m = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 2.2, roughness: 0.4 });
  else if (L.glass) m = new THREE.MeshPhysicalMaterial({ color: col, metalness: L.m, roughness: L.r, transparent: true, opacity: 0.55, clearcoat: 1 });
  else m = new THREE.MeshStandardMaterial({ color: col, metalness: L.m, roughness: L.r, envMapIntensity: 0.9 });
  return (mats[name] = m);
}

const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const cylGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 40);
const ballGeo = new THREE.SphereGeometry(0.5, 32, 20);

// Same maths as GunModels.luau: frame (offset + roll by tilt) * part offset * Angles(pitch, 0, roll) * shape turn.
function build(model) {
  const g = new THREE.Group();
  for (const p of model.parts) {
    let mesh;
    if (p.shape === "box") { mesh = new THREE.Mesh(boxGeo, mat(p.look)); mesh.scale.set(p.w, p.h, p.d); }
    else if (p.shape === "ball") { mesh = new THREE.Mesh(ballGeo, mat(p.look)); mesh.scale.set(p.w, p.w, p.w); }
    else { mesh = new THREE.Mesh(cylGeo, mat(p.look)); mesh.scale.set(p.h, p.w, p.h); }
    const shape = new THREE.Matrix4();
    if (p.shape === "cylX") shape.makeRotationZ(Math.PI / 2);
    else if (p.shape === "cylZ") shape.makeRotationX(Math.PI / 2);
    const local = new THREE.Matrix4().makeTranslation(p.x, p.y, p.z)
      .multiply(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(p.pitch, 0, p.roll, "XYZ")))
      .multiply(shape);
    const fr = p.frame && model.frames[p.frame];
    const base = fr ? new THREE.Matrix4().makeTranslation(fr.x, fr.y, 0).multiply(new THREE.Matrix4().makeRotationZ(fr.tilt)) : new THREE.Matrix4();
    const m = base.multiply(local).multiply(new THREE.Matrix4().makeScale(mesh.scale.x, mesh.scale.y, mesh.scale.z));
    mesh.matrixAutoUpdate = false; mesh.matrix.copy(m);
    mesh.castShadow = true; mesh.receiveShadow = true;
    g.add(mesh);
  }
  // centre it and sit it above the floor
  const bb = new THREE.Box3().setFromObject(g);
  const c = bb.getCenter(new THREE.Vector3());
  const holder = new THREE.Group();
  g.position.set(-c.x, -bb.min.y + 0.6, -c.z);
  holder.add(g);
  holder.userData.size = bb.getSize(new THREE.Vector3());
  return holder;
}

  const dps = Math.round(gun.dmg * gun.rate);
  const rows = [
    ["Hit", gun.dmgNote || gun.dmg, gun.dmg / MAX.dmg, PISTOL.dmg / MAX.dmg],
    ["Shots / sec", gun.rate, gun.rate / 11, PISTOL.rate / 11],
    ["Damage / sec", dps, dps / MAX.dps, (PISTOL.dmg * PISTOL.rate) / MAX.dps],
    ["Magazine", gun.mag, gun.mag / MAX.mag, PISTOL.mag / MAX.mag],
    ["Range", gun.range, gun.range / MAX.range, PISTOL.range / MAX.range],
  ];
  document.getElementById("stats").innerHTML = rows.map(([k, v, f, p]) =>
    `<div class="row"><span class="k">${k}</span><span class="bar"><i style="width:${Math.min(100, f * 100)}%"></i><u style="left:${Math.min(99, p * 100)}%"></u></span><span class="v">${v}</span></div>`).join("");
}

const picks = document.getElementById("picks");
GUNS.forEach((g, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "pick"; b.id = "pick-" + g.id;
  b.innerHTML = `${g.letter ? g.letter + " " : ""}${g.name}<span>${g.kind}</span>`;
  b.addEventListener("click", () => { show(i); idle = 0; });
  picks.appendChild(b);
});

// drag / pinch
let drag = null, pinch = null;
const pts = new Map();
canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); drag = [e.clientX, e.clientY]; idle = 0; });
canvas.addEventListener("pointermove", (e) => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) zoom = Math.min(2.6, Math.max(0.6, zoom * (d / pinch)));
    pinch = d; return;
  }
  if (drag) {
    yaw += (e.clientX - drag[0]) * 0.008;
    pitch = Math.min(1.2, Math.max(-0.2, pitch + (e.clientY - drag[1]) * 0.006));
    drag = [e.clientX, e.clientY];
  }
});
const up = (e) => { pts.delete(e.pointerId); pinch = null; drag = pts.size ? [...pts.values()][0] : null; };
canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
canvas.addEventListener("wheel", (e) => { e.preventDefault(); zoom = Math.min(2.6, Math.max(0.6, zoom * (e.deltaY < 0 ? 1.1 : 0.9))); }, { passive: false });
document.getElementById("zin").onclick = () => { zoom = Math.min(2.6, zoom * 1.25); };
document.getElementById("zout").onclick = () => { zoom = Math.max(0.6, zoom / 1.25); };

function resize() {
  const r = canvas.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  idle += dt;
  if (!still && idle > 2.5) yaw += dt * 0.35;
  const size = current ? current.userData.size : new THREE.Vector3(6, 2, 1);
  const fit = Math.max(size.x / camera.aspect, size.y * 1.6) * 1.25 / (2 * Math.tan((camera.fov * Math.PI) / 360));
  const dist = fit / zoom;
  const cy = size.y * 0.5 + 0.6;
  camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, cy + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(0, cy, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize(); show(0); requestAnimationFrame(frame);
</script>
