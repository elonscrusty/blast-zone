<title>Circuit District Heroes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* One 3D lineup on top, the pick buttons and the hero card under it. Single dark look on purpose. */
:root {
  --bg: #0b1220; --stage: #14243a; --panel: #111c2e; --line: #24364f;
  --fg: #e8eef6; --muted: #8ea2bb; --cyan: #36d9e8; --gold: #ffc44d; --coral: #f15b64;
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); margin: 0; }
body { font-family: var(--body); }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-size: 1.5rem; letter-spacing: .04em; margin: 0; text-transform: uppercase; }
.hint { color: var(--muted); font-size: .85rem; }
.stage { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 30%, #1d3352 0%, var(--stage) 55%, #0c1626 100%);
  aspect-ratio: 4 / 3; max-height: 66vh; width: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lab { position: absolute; transform: translate(-50%, -100%); text-align: center; font-family: var(--display);
  text-transform: uppercase; letter-spacing: .05em; font-size: .85rem; text-shadow: 0 1px 6px rgba(0,0,0,.8); white-space: nowrap; }
.lab b { display: block; font-family: var(--mono); font-weight: 500; color: var(--gold); font-size: .8rem; letter-spacing: .02em; }
.lab.sel { color: var(--cyan); }
.views { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.views button { min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(11,18,32,.78); color: var(--fg); font-family: var(--display); font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }
.views button[aria-pressed="true"] { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pick { min-height: 64px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font-family: var(--display); font-size: 1rem; text-transform: uppercase; letter-spacing: .04em;
  display: grid; gap: 2px; place-content: center; text-align: center; padding: 6px 4px; }
.pick span { font-family: var(--mono); font-size: .68rem; color: var(--muted); letter-spacing: .06em; text-transform: none; }
.pick[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.chip { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font-family: var(--display); font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; padding: 4px; }
.chip[aria-pressed="true"] { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.plate { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 12px; }
.plate h2 { font-family: var(--display); margin: 0; font-size: 1.3rem; text-transform: uppercase; letter-spacing: .04em; }
.plate h2 small { font-family: var(--mono); font-size: .75rem; color: var(--cyan); letter-spacing: .1em; margin-left: 8px; }
.blurb { margin: 0; color: var(--muted); font-size: .95rem; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { background: #0e1829; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 7px; align-content: start; }
.card h3 { margin: 0; font-family: var(--display); font-size: 1rem; text-transform: uppercase; letter-spacing: .04em; }
.card h3 small { color: var(--muted); font-family: var(--mono); font-size: .65rem; margin-left: 6px; letter-spacing: .08em; }
.row { display: grid; grid-template-columns: 5.6em minmax(0, 1fr) 4.2em; gap: 8px; align-items: center; font-size: .8rem; }
.row .k { color: var(--muted); }
.row .v { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: #1b2a40; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--cyan); border-radius: 4px; transition: width .35s ease; }
.bar i.hp { background: var(--coral); }
.bar i.sp { background: var(--gold); }
@media (max-width: 560px) { .cards { grid-template-columns: 1fr; } .views button { padding: 0 9px; } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Heroes</h1>
    <div class="hint">Drag to spin. Tap a hero. Look at the 3 sizes of difference below.</div>
  </header>
  <div class="stage">
    <canvas id="view" aria-label="3D hero lineup"></canvas>
    <div class="labels" id="labels"></div>
    <div class="views" id="views"></div>
  </div>
  <div class="row3" id="spreads"></div>
  <div class="chips" id="chips"></div>
  <section class="plate" id="plate"></section>
</div>

// ---------- heroes: original placeholder bodies (Claude Design owns the real looks) ----------
const GUN_OF = { ranger: "volt_pistol", bulwark: "breaker", wisp: "hornet", sentinel: "longline", rigger: "volt_pistol" };

// ---------- scene state ----------
const heroes = {}, hitboxes = [], X0 = -6.4, DX = 3.2;
DATA.order.forEach((id, i) => {
  const f = figure(id); f.position.set(X0 + i * DX, 0, 0); f.rotation.y = 0.18 * (i - 2) * -1;
  scene.add(f);
  const bar = new THREE.Group(); bar.position.set(0, 5.35, 0); f.add(bar);
  const back = new THREE.Mesh(boxG, mat(NAVY)); back.scale.set(2.5, 0.28, 0.12); bar.add(back);
  const fill = new THREE.Mesh(boxG, mat(ACCENT[id], { neon: true })); fill.scale.set(2.3, 0.18, 0.16); fill.position.z = 0.03; bar.add(fill);
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.5, 1.75, 40), new THREE.MeshBasicMaterial({ color: ACCENT[id], transparent: true, opacity: 0.0, side: THREE.DoubleSide }));

});

const labelsEl = document.getElementById("labels");
const labs = {};
DATA.order.forEach((id) => { const d = document.createElement("div"); d.className = "lab"; labelsEl.appendChild(d); labs[id] = d; });

let spreadKey = STAR, sel = "bulwark", mode = "lineup";
const spreadOf = () => DATA.spreads.find((s) => s.key === spreadKey);
const MAXHP = 160;

function refresh() {
  const S = spreadOf();
  for (const id of DATA.order) {
    const c = S.heroes[id], h = heroes[id];
    const w = 2.3 * (c.health / MAXHP) / (140 / MAXHP) * (1 / 1.0) * 0.55 + 0.25;
    h.targetW = Math.max(0.3, 2.3 * c.health / 160);
    h.ring.material.opacity = id === sel ? 0.9 : 0;
    labs[id].className = "lab" + (id === sel ? " sel" : "");
    labs[id].innerHTML = `${c.name}<b>${c.health} HP</b>`;
    // launcher muzzle follows blast size
    const blast = c.guns[1].lines.find((l) => l.key === "radius");
    const sc = 0.55 + 0.9 * blast.bar;
    h.f.userData.launcher.userData.muzzle.scale.set(0.3 * sc + 0.15, 0.3 * sc + 0.15, 0.3 * sc + 0.15);
  }
  document.querySelectorAll(".pick").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === spreadKey)));
  document.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === sel)));
  plate();
}
function bars(lines) {
  return lines.map((l) => `<div class="row"><span class="k">${l.label}</span><span class="bar"><i style="width:${Math.round(l.bar * 100)}%"></i></span><span class="v">${l.text}</span></div>`).join("");
}
function plate() {
  const c = spreadOf().heroes[sel];
  const kinds = ["SLOT 1 GUN", "SLOT 2 BLASTER"];
  document.getElementById("plate").innerHTML =
    `<h2>${c.name}<small>${c.role.toUpperCase()}</small></h2><p class="blurb">${c.blurb}</p>
     <div class="card"><div class="row"><span class="k">Health</span><span class="bar"><i class="hp" style="width:${Math.round(c.healthBar * 100)}%"></i></span><span class="v">${c.health}</span></div>
     <div class="row"><span class="k">Run speed</span><span class="bar"><i class="sp" style="width:${Math.round(c.speedBar * 100)}%"></i></span><span class="v">${Math.round(c.speed * 100)}%</span></div></div>
     <div class="cards">${c.guns.map((g, i) => `<div class="card"><h3>${g.name}<small>${kinds[i]}</small></h3>${bars(g.lines)}</div>`).join("")}</div>`;
}

const spreadsEl = document.getElementById("spreads");
DATA.spreads.forEach((s) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "pick"; b.dataset.k = s.key;
  b.innerHTML = `${s.key === STAR ? "⭐ " : ""}${s.key} ${s.name}<span>${SPREAD_NOTE[s.key]}</span>`;
  b.onclick = () => { spreadKey = s.key; refresh(); };
  spreadsEl.appendChild(b);
});
const chipsEl = document.getElementById("chips");
DATA.order.forEach((id) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.dataset.id = id; b.textContent = DATA.spreads[1].heroes[id].name;
  b.onclick = () => { sel = id; refresh(); };
  chipsEl.appendChild(b);
});
const viewsEl = document.getElementById("views");
const VIEWS = { lineup: "All", close: "Close", game: "Game view" };
for (const k in VIEWS) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = VIEWS[k]; b.dataset.m = k;
  b.onclick = () => { mode = k; yawOff = 0; pitchOff = 0; idle = 0; setViews(); };
  viewsEl.appendChild(b);
}
function setViews() { viewsEl.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === mode))); }

// ---------- camera ----------
let yawOff = 0, pitchOff = 0, idle = 0;
const cam = { tx: 0, ty: 2.6, tz: 0, dist: 20, yaw: 0, pitch: 0.2 };
function target() {
  const aspect = camera.aspect, wide = Math.max(1, 1.33 / aspect);
  if (mode === "close") { const f = heroes[sel].f.position; return { tx: f.x, ty: 3.0, tz: 0, dist: 17, yaw: 0.35, pitch: 0.1 }; }
  if (mode === "game") return { tx: 0, ty: 0, tz: 0, dist: 34 * wide, yaw: 0, pitch: 0.96 };
  return { tx: 0, ty: 2.7, tz: 0, dist: 21 * wide, yaw: 0, pitch: 0.17 };
}
function frame(t) {
  const dt = Math.min(0.05, (t - (frame.last || t)) / 1000); frame.last = t; idle += dt;
  const T = target(), k = 1 - Math.exp(-dt * 6);
  for (const p of ["tx", "ty", "tz", "dist", "yaw", "pitch"]) cam[p] += (T[p] - cam[p]) * k;
  const yaw = cam.yaw + yawOff, pitch = Math.min(1.3, Math.max(0, cam.pitch + pitchOff));
  camera.position.set(cam.tx + Math.sin(yaw) * Math.cos(pitch) * cam.dist, cam.ty + Math.sin(pitch) * cam.dist, cam.tz + Math.cos(yaw) * Math.cos(pitch) * cam.dist);
  camera.lookAt(cam.tx, cam.ty, cam.tz);

    const h = heroes[id]; const w = h.targetW || 2.3;
    h.fill.scale.x += (w - h.fill.scale.x) * k; h.fill.position.x = -(2.3 - h.fill.scale.x) / 2;
    h.bar.quaternion.copy(camera.quaternion);
    h.ring.rotation.z += dt * 0.8;
    if (!still) h.f.rotation.y = (id === sel && mode !== "game" ? Math.sin(t / 1400) * 0.25 : h.f.rotation.y);
  }
  renderer.render(scene, camera);
  const r = canvas.getBoundingClientRect();
  for (const id of DATA.order) {
    const v = new THREE.Vector3(); heroes[id].f.getWorldPosition(v); v.y += 5.9;
    v.project(camera);
    const L = labs[id]; L.style.left = ((v.x * 0.5 + 0.5) * r.width) + "px"; L.style.top = ((-v.y * 0.5 + 0.5) * r.height) + "px";
    L.style.display = mode === "game" || (mode === "close" && id !== sel) ? "none" : "block";
  }

const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- input ----------
const ray = new THREE.Raycaster(), pts = new Map(); let drag = null, moved = 0;
canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); drag = [e.clientX, e.clientY]; moved = 0; });
canvas.addEventListener("pointermove", (e) => {
  if (!pts.has(e.pointerId) || !drag) return;
  const dx = e.clientX - drag[0], dy = e.clientY - drag[1]; moved += Math.abs(dx) + Math.abs(dy);
  yawOff -= dx * 0.006; pitchOff += dy * 0.005; drag = [e.clientX, e.clientY];
});
canvas.addEventListener("pointerup", (e) => {
  pts.delete(e.pointerId); drag = null;
  if (moved < 6) {
    const r = canvas.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
    const hit = ray.intersectObjects(hitboxes)[0];
    if (hit) { sel = hit.object.userData.id; refresh(); }
  }
});
canvas.addEventListener("pointercancel", () => { pts.clear(); drag = null; });
function resize() {
  const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize(); refresh(); setViews();
requestAnimationFrame(frame);
window.__heroPreview = { set(k, s, m) { if (k) spreadKey = k; if (s) sel = s; if (m) mode = m; yawOff = pitchOff = 0; refresh(); setViews(); } };
</script>
